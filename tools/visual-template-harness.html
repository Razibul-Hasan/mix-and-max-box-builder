<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ProductBoxes template visual harness</title>
	<link rel="stylesheet" href="../build/tokens.css">
	<link rel="stylesheet" href="../build/components.css">
	<link rel="stylesheet" href="../build/storefront.css">
	<style>
		html, body { margin: 0; min-height: 100%; background: #f4f4f2; }
		body { padding: 0; }
	</style>
</head>
<body>
	<div
		id="box"
		class="mmbb-root mmbb-builder mmbb-box-1"
		data-mmbb-id="5"
		style="--mmbb-accent:#8b5cf6;--mmbb-button-text:#fff;--mmbb-bg:#fff8f3;--mmbb-surface:#fff;--mmbb-text:#2d2433;--mmbb-muted:#6d6373;--mmbb-savings:#0a7a3b;--mmbb-font-heading:'Bricolage Grotesque',system-ui,sans-serif;--mmbb-font-body:Figtree,system-ui,sans-serif;--mmbb-heading-size:76px;--mmbb-heading-weight:800;--mmbb-btn-radius:22px;--mmbb-btn-height:46px;--mmbb-card-radius:18px;--mmbb-card-shadow:none;--mmbb-cols:3;--mmbb-ratio:1 / 1;--mmbb-fit:contain;--mmbb-pad-top:56px;--mmbb-pad-right:64px;--mmbb-pad-bottom:56px;--mmbb-pad-left:64px;--max:var(--mmbb-accent);--on-max:var(--mmbb-button-text);--canvas:var(--mmbb-bg);--surface:var(--mmbb-surface);--ink:var(--mmbb-text);--ink-muted:var(--mmbb-muted);--max-strong:var(--mmbb-savings);--font-display:var(--mmbb-font-heading);--font-sans:var(--mmbb-font-body)"
	></div>
	<script src="../design/canvas/lib/react.production.min.js"></script>
	<script src="../design/canvas/lib/react-dom.production.min.js"></script>
	<script>
		window.onerror = function(message, source, line, column, error) {
			document.body.insertAdjacentHTML('beforeend', '<pre id="visual-error" style="white-space:pre-wrap;color:#b00;padding:20px">' + String(error && error.stack || message) + '</pre>');
		};
		function jsx(type, props, key) {
			return React.createElement(type, key === undefined ? props : Object.assign({}, props, { key:key }));
		}
		window.ReactJSXRuntime = { jsx: jsx, jsxs: jsx, Fragment: React.Fragment };
		function format(template, args) {
			let index = 0;
			return template.replace(/%(?:(\d+)\$)?[sd]/g, function(match, position) {
				const value = args[position ? Number(position) - 1 : index++];
				return value === undefined ? match : String(value);
			});
		}
		window.wp = {
			element: Object.assign({}, React, {
				createRoot: ReactDOM.createRoot,
				createInterpolateElement: function(text) { return text.replace(/<[^>]+>/g, ''); }
			}),
			i18n: {
				__: function(text) { return text; },
				_x: function(text) { return text; },
				_n: function(single, plural, number) { return Number(number) === 1 ? single : plural; },
				sprintf: function(text) { return format(text, Array.prototype.slice.call(arguments, 1)); }
			}
		};
		const params = new URLSearchParams(location.search);
		const template = params.get('template') || 'pastel';
		const theme = {
			pastel: ['#8b5cf6','#fff8f3','#fff','#2d2433','#6d6373','#0a7a3b','76px'],
			editorial: ['#c2410c','#f5f1ea','#f5f1ea','#1a1a1a','#655f57','#9a3412','84px'],
			night: ['#c8ff2e','#0c0c10','#18181d','#f4f4f5','#a1a1aa','#c8ff2e','88px'],
			split: ['#ff6b4a','#fff','#fff','#111','#5b6069','#c2410c','76px'],
			compact: ['#e11d74','#f4f4f2','#fff','#111','#666','#be185d','42px'],
			clean: ['#222','#fff','#fff','#222','#666','#087f5b','34px']
		}[template];
		const root = document.getElementById('box');
		if (params.get('width')) root.style.width = params.get('width') + 'px';
		['accent','bg','surface','text','muted','savings'].forEach(function(key, i) { root.style.setProperty('--mmbb-' + key, theme[i]); });
		root.style.setProperty('--mmbb-heading-size', theme[6]);
		root.style.setProperty('--max', theme[0]);
		root.style.setProperty('--canvas', theme[1]);
		root.style.setProperty('--surface', theme[2]);
		root.style.setProperty('--ink', theme[3]);
		root.style.setProperty('--ink-muted', theme[4]);
		root.style.setProperty('--max-strong', theme[5]);
		if (template === 'night') root.style.setProperty('--mmbb-button-text', '#111');
		const image = name => '../design/canvas/images/' + name + '.png';
		const products = [
			[1,'Beanie',1800,'beanie'], [2,'Belt',5500,'belt'], [3,'Cap',1600,'cap'],
			[4,'Sunglasses',9000,'sunglasses'], [5,'T-shirt',1800,'tshirt']
		].map(function(row) { return { id:row[0], product_id:row[0], variation_id:0, name:row[1], meta:'', price:row[2], compare_at:0, stock:null, image:image(row[3]), categories:[], badge:null }; });
		window.sessionStorage.setItem('mmbb:box:5', JSON.stringify({ items:[1,1,3,5,5], size:0, gift:{ enabled:false, message:'' } }));
		window.mmbbBuilders = { 5: {
			id:5, title: template === 'pastel' ? 'Pick. Mix. Save more.' : template === 'editorial' ? 'Your box, curated by you.' : template === 'night' ? 'Build the box. Drop the price.' : template === 'split' ? 'Fill it up. Pay less.' : 'Build a box', status:'active', preview:false,
			config:{ type:'tiered', box:{ capacity:12, min_items:4, allow_duplicates:true, max_per_product:12, hide_sold_out:false }, tiers:[{qty:4,discount_type:'percent',value:10},{qty:6,discount_type:'percent',value:15},{qty:12,discount_type:'percent',value:25}], sizes:[], bundle:{qty:3,price:0}, extras:{gift_message:false,gift_wrap:{enabled:false,fee:0}}, design:{ template:template, headline:'', intro:'Mix any 4+ and save up to 25%.', sticker:'', show_stickers:false, show_ladder:true, theme:'light', cta_label:'', summary:{position:'right',progress:'bar',slots:'photos'}, buttons:{style:'fill'}, cards:{show_compare_price:true,show_sale_badge:true}, typography:{button_uppercase:false} }, caps:{}, schedule:{end:null,countdown_days:0} },
			view:{layout:'panel',columns:3,showHero:true}, settings:{unlockToast:true,stickers:true,ctaLabel:'',emptyHint:''}, products:products,
			money:{symbol:'৳',position:'right',decimals:2,decimalSeparator:'.',thousandSeparator:','}, now:'2026-01-01T00:00:00Z', cart:{nonce:'n',addUrl:'/add',cartUrl:'/cart/'}, edit:null
		} };
	</script>
	<script src="../build/storefront.js"></script>
	<script>
		if (new URLSearchParams(location.search).get('debug') === '1') setTimeout(function() {
			const selectors = ['#box','.mmbb-template','.mmbb-builder__inner','.mmbb-builder__grid','.mmbb-tile','.mmbb-tile__action'];
			const data = selectors.map(function(selector) {
				const node = document.querySelector(selector);
				const rect = node && node.getBoundingClientRect();
				const style = node && getComputedStyle(node);
				return { selector:selector, className:node && node.className, x:rect && rect.x, width:rect && rect.width, columns:style && style.gridTemplateColumns, padding:style && style.padding };
			});
			const pre = document.createElement('pre');
			pre.style.cssText = 'position:fixed;inset:0;z-index:999999;margin:0;padding:16px;background:#fff;color:#000;white-space:pre-wrap;font:12px monospace';
			pre.textContent = JSON.stringify(data, null, 2);
			document.body.appendChild(pre);
		}, 500);
	</script>
</body>
</html>
