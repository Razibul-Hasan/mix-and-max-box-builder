<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build-a-Spa Kit — Northwind Pantry</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="mixmax-tokens.css">
<link rel="stylesheet" href="ds/mixmax/components/bundle.css">
<script src="ds/mixmax/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#f5f5f2}
a:not([class]){color:#141414}a:not([class]):hover{color:#c23b0a}
</style>
</helmet>
<div class="mmbb-root" style="min-height: 1620px; background: var(--canvas); color: var(--ink); font-family: var(--font-sans);">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 32px; min-height: 68px; padding: 12px 48px; background: var(--surface); border-bottom: 1px solid var(--line);">
    <span style="font-family: var(--font-display); font-size: 22px; font-weight: 800; letter-spacing: -0.02em;">Northwind Pantry</span>
    <nav aria-label="Store" style="flex: 1; display: flex; flex-wrap: wrap; gap: 24px; font-weight: 600;">
      <a href="#shop" style="color: var(--ink-muted); text-decoration: none;">Shop</a>
      <a href="StoreTiered.dc.html" style="color: var(--ink); text-decoration: none;">Gift boxes</a>
      <a href="#journal" style="color: var(--ink-muted); text-decoration: none;">Journal</a>
      <a href="#about" style="color: var(--ink-muted); text-decoration: none;">About</a>
    </nav>
    <a href="Cart.dc.html" aria-label="Cart" style="color: var(--ink);"><x-import component-from-global-scope="MixMax.Icon" name="cart" size="{{n.i22}}"></x-import></a>
  </header>

  <section style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 40px 48px 24px;">
    <div style="flex: 1 1 520px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px;">
      <x-import component-from-global-scope="MixMax.Sticker" tone="max" tilt="{{yes}}" icon="flame">Spa week</x-import>
      <h1 style="margin: 0; font-family: var(--font-display); font-size: 48px; line-height: 50px; font-weight: 800; letter-spacing: -0.03em;">Build a spa kit. <span style="color: var(--max-strong);">Save up to 25%.</span></h1>
      <p style="margin: 0; max-width: 560px; font-size: 16px; line-height: 24px; color: var(--ink-muted);">Choose a box, fill every slot, and we wrap it. Bigger boxes save more.</p>
    </div>
    <x-import component-from-global-scope="MixMax.Countdown" seconds="{{n.ends}}"></x-import>
  </section>

  <section style="padding: 0 48px 24px; display: flex; flex-direction: column; gap: 16px;">
    <div style="max-width: 560px;"><x-import component-from-global-scope="MixMax.Steps" steps="{{flow}}" current="{{stepIndex}}"></x-import></div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 11px; line-height: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted);">Step 1</span>
      <h2 style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 650;">Pick a box size</h2>
    </div>
    <div style="max-width: 720px;"><x-import component-from-global-scope="MixMax.BoxSizePicker" sizes="{{sizes}}" value="{{size}}" on-change="{{pickSize}}"></x-import></div>
  </section>

  <section style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; padding: 8px 48px 64px;">
    <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 11px; line-height: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted);">Step 2</span>
        <h2 style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 650;">Fill your box</h2>
      </div>
      <x-import component-from-global-scope="MixMax.Chips" label="Category" options="{{cats}}" default-value="All"></x-import>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;">
        <sc-for list="{{tiles}}" as="p" hint-placeholder-count="6">
          <x-import component-from-global-scope="MixMax.ProductTile" name="{{p.name}}" meta="{{p.meta}}" price="{{p.price}}" art="{{p.art}}" badge="{{p.badge}}" badge-tone="{{p.badgeTone}}" stock="{{p.stock}}" qty="{{p.qty}}" on-add="{{p.add}}" on-change="{{p.change}}" box-full="{{full}}"></x-import>
        </sc-for>
      </div>
    </div>
    <div style="flex: 1 1 340px; max-width: 380px; min-width: 0; position: sticky; top: 16px;">
      <x-import component-from-global-scope="MixMax.BoxPanel" title="Your spa kit" size="{{size}}" items="{{items}}" tiers="{{tiers}}" subtotal="{{subtotal}}" total="{{total}}" on-remove="{{removeAt}}" cta-href="Cart.dc.html" footnote="Gift-wrapped free on every kit"></x-import>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1620}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { size: 6, box: [11, 12, 13, 15] };
  }
  renderVals() {
    const P = [
      { id: 11, name: 'Oat Milk Soap', meta: 'Bar soap · 100 g', price: 6.5, art: 'soap', badge: 'Bestseller', badgeTone: 'deal' },
      { id: 12, name: 'Fig & Cedar Candle', meta: 'Soy candle · 120 g', price: 9, art: 'candle', stock: 3 },
      { id: 13, name: 'Chamomile Calm', meta: 'Loose tea · 50 g', price: 7, art: 'tea' },
      { id: 14, name: 'Lavender Soap', meta: 'Bar soap · 100 g', price: 6.5, art: 'soap', badge: 'New', badgeTone: 'info' },
      { id: 15, name: 'Honey Body Balm', meta: 'Balm · 60 ml', price: 11, art: 'honey' },
      { id: 16, name: 'Amber Sea Candle', meta: 'Soy candle · 120 g', price: 9, art: 'candle' }
    ];
    const S = [{ qty: 4, price: 26, save: '10%' }, { qty: 6, price: 38, save: '15%', tag: 'Most popular' }, { qty: 12, price: 72, save: '25%', tag: 'Best value' }];
    const s = this.state;
    const cur = S.find((x) => x.qty === s.size) || S[1];
    const pct = parseInt(cur.save, 10);
    const box = s.box.slice(0, s.size);
    const items = box.map((id) => P.find((p) => p.id === id));
    const subtotal = items.reduce((a, p) => a + p.price, 0);
    const full = box.length >= s.size;
    const setQty = (id, n) => {
      const c = box.filter((x) => x === id).length;
      if (n > c) this.setState({ box: box.concat(Array(n - c).fill(id)).slice(0, s.size) });
      else { let drop = c - n; this.setState({ box: box.filter((x) => (x === id && drop > 0 ? (drop--, false) : true)) }); }
    };
    return {
      yes: true,
      n: { i22: 22, ends: 2 * 86400 + 4 * 3600 + 18 * 60 },
      flow: ['Pick a size', 'Fill your box', 'Checkout'],
      stepIndex: full ? 2 : 1,
      sizes: S,
      size: s.size,
      pickSize: (v) => this.setState({ size: v, box: s.box.slice(0, v) }),
      cats: ['All', 'Bath', 'Candles', 'Tea', 'Body'],
      full: full,
      tiles: P.map((p) => Object.assign({}, p, {
        qty: box.filter((x) => x === p.id).length,
        add: () => setQty(p.id, 1),
        change: (n) => setQty(p.id, n)
      })),
      items: items,
      tiers: [{ qty: s.size, label: cur.save + ' off' }],
      subtotal: subtotal,
      total: full ? subtotal * (1 - pct / 100) : subtotal,
      removeAt: (i) => this.setState({ box: box.filter((_, j) => j !== i) })
    };
  }
}
</script>
</body>
</html>
