<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Box complete — Northwind Pantry</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="mixmax-tokens.css">
<link rel="stylesheet" href="ds/mixmax/components/bundle.css">
<script src="ds/mixmax/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#f5f5f2}
a:not([class]){color:#141414}a:not([class]):hover{color:#c23b0a}
</style>
</helmet>
<div class="mmbb-root" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--canvas); color: var(--ink); font-family: var(--font-sans);">
  <header style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 8px; background: var(--surface); border-bottom: 1px solid var(--line);">
    <a href="#menu" aria-label="Menu" style="display: grid; place-items: center; width: 44px; height: 44px; color: var(--ink);"><x-import component-from-global-scope="MixMax.Icon" name="more" size="{{n.i22}}"></x-import></a>
    <span style="font-family: var(--font-display); font-size: 19px; font-weight: 800; letter-spacing: -0.02em;">Northwind Pantry</span>
    <a href="Cart.dc.html" aria-label="Cart" style="display: grid; place-items: center; width: 44px; height: 44px; color: var(--ink);"><x-import component-from-global-scope="MixMax.Icon" name="cart" size="{{n.i22}}"></x-import></a>
  </header>

  <section style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin: 16px; padding: 20px; border-radius: 20px; background: var(--max); color: var(--on-max);">
    <x-import component-from-global-scope="MixMax.Sticker" tone="ink" size="sm" tilt="{{yes}}" icon="sparkle">Box complete</x-import>
    <p style="margin: 0; font-family: var(--font-display); font-size: 40px; line-height: 40px; font-weight: 800; letter-spacing: -0.03em;">25% off unlocked</p>
    <p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 600;">That's the max deal. You save $24.50 on this kit.</p>
  </section>

  <section style="padding: 0 16px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px;">
      <span style="font-size: 17px; line-height: 24px; font-weight: 650;">Your 12-item spa kit</span>
      <a href="MobileDrawer.dc.html" style="font-size: 13px; font-weight: 600;">Edit</a>
    </div>
    <x-import component-from-global-scope="MixMax.BoxSlots" size="{{n.twelve}}" items="{{items}}" columns="{{n.six}}"></x-import>
    <ul style="list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 20px; color: var(--ink-muted);">
      <li style="display: flex; justify-content: space-between;"><span>2 × Oat Milk Soap</span><span style="font-variant-numeric: tabular-nums;">$13.00</span></li>
      <li style="display: flex; justify-content: space-between;"><span>2 × Fig &amp; Cedar Candle</span><span style="font-variant-numeric: tabular-nums;">$18.00</span></li>
      <li style="display: flex; justify-content: space-between;"><span>2 × Chamomile Calm</span><span style="font-variant-numeric: tabular-nums;">$14.00</span></li>
      <li style="display: flex; justify-content: space-between;"><span>+ 3 more products</span><span style="font-variant-numeric: tabular-nums;">$53.00</span></li>
    </ul>
  </section>

  <div style="position: absolute; left: 50%; bottom: 148px; transform: translateX(-50%); z-index: 20; white-space: nowrap;">
    <x-import component-from-global-scope="MixMax.Toast" icon="sparkle">You unlocked 25% off</x-import>
  </div>
  <div style="position: absolute; left: 10px; right: 10px; bottom: 12px; z-index: 10;">
    <x-import component-from-global-scope="MixMax.BoxSummaryBar" size="{{n.twelve}}" items="{{items}}" tiers="{{tiers}}" total="{{n.total}}" compare-at="{{n.sub}}" open-href="MobileDrawer.dc.html" cta-href="Cart.dc.html" cta-label="Checkout"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const kinds = [['Oat Milk Soap', 'soap'], ['Fig & Cedar Candle', 'candle'], ['Chamomile Calm', 'tea'], ['Lavender Soap', 'soap'], ['Honey Body Balm', 'honey'], ['Amber Sea Candle', 'candle']];
    const items = [];
    kinds.forEach((k) => { items.push({ name: k[0], art: k[1] }); items.push({ name: k[0], art: k[1] }); });
    return {
      yes: true,
      n: { i22: 22, twelve: 12, six: 6, sub: 98, total: 73.5 },
      items: items,
      tiers: [{ qty: 12, label: '25% off' }]
    };
  }
}
</script>
</body>
</html>
