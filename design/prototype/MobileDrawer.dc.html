<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Box drawer — Northwind Pantry</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="mixmax-tokens.css">
<link rel="stylesheet" href="ds/mixmax/components/bundle.css">
<script src="ds/mixmax/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#f5f5f2}
a:not([class]){color:#141414}a:not([class]):hover{color:#c23b0a}
</style>
</helmet>
<div class="mmbb-root" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--canvas); color: var(--ink); font-family: var(--font-sans);">
  <header style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 8px; background: var(--surface); border-bottom: 1px solid var(--line);">
    <span style="display: grid; place-items: center; width: 44px; height: 44px;"><x-import component-from-global-scope="MixMax.Icon" name="more" size="{{n.i22}}"></x-import></span>
    <span style="font-family: var(--font-display); font-size: 19px; font-weight: 800; letter-spacing: -0.02em;">Northwind Pantry</span>
    <span style="display: grid; place-items: center; width: 44px; height: 44px;"><x-import component-from-global-scope="MixMax.Icon" name="cart" size="{{n.i22}}"></x-import></span>
  </header>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 16px;" aria-hidden="true">
    <x-import component-from-global-scope="MixMax.ProductTile" name="Oat Milk Soap" price="{{price.soap}}" art="soap" qty="{{n.one}}"></x-import>
    <x-import component-from-global-scope="MixMax.ProductTile" name="Fig &amp; Cedar Candle" price="{{price.candle}}" art="candle" qty="{{n.one}}"></x-import>
  </div>

  <div style="position: absolute; inset: 0; z-index: 20; background: var(--scrim);"></div>
  <section role="dialog" aria-modal="true" aria-label="Your spa kit" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; max-height: 760px; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0; box-shadow: var(--shadow-bar);">
    <div style="display: flex; justify-content: center; padding: 10px 0 2px;"><span style="width: 40px; height: 4px; border-radius: 999px; background: var(--line-strong);"></span></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 20px;">
      <span style="color: var(--ink-muted); font-size: 13px; line-height: 18px;">Tap a slot to remove an item</span>
      <x-import component-from-global-scope="MixMax.Button" variant="ghost" icon="close" aria-label="Close" href="MobileFill.dc.html"></x-import>
    </div>
    <div style="padding: 4px 12px 16px;">
      <x-import component-from-global-scope="MixMax.BoxPanel" title="Your spa kit" size="{{n.six}}" items="{{items}}" tiers="{{tiers}}" subtotal="{{subtotal}}" total="{{total}}" on-remove="{{removeAt}}" cta-href="Cart.dc.html" cta-label="Checkout" footnote="Gift-wrapped free on every kit" style="display: block;">
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <x-import component-from-global-scope="MixMax.Checkbox" label="Make it a gift" description="No prices inside the box." default-checked="{{yes}}"></x-import>
          <x-import component-from-global-scope="MixMax.TextField" label="Gift message" multiline="{{yes}}" rows="{{n.two}}" placeholder="Write a short note (optional)" default-value="Happy birthday! Take a long bath."></x-import>
        </div>
      </x-import>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { box: [11, 12, 14, 16] };
  }
  renderVals() {
    const P = {
      11: { name: 'Oat Milk Soap', price: 6.5, art: 'soap' },
      12: { name: 'Fig & Cedar Candle', price: 9, art: 'candle' },
      14: { name: 'Lavender Soap', price: 6.5, art: 'soap' },
      16: { name: 'Amber Sea Candle', price: 9, art: 'candle' }
    };
    const items = this.state.box.map((id) => P[id]);
    const subtotal = items.reduce((a, p) => a + p.price, 0);
    return {
      yes: true,
      n: { i22: 22, one: 1, two: 2, six: 6 },
      price: { soap: 6.5, candle: 9 },
      items: items,
      tiers: [{ qty: 6, label: '15% off' }],
      subtotal: subtotal,
      total: subtotal,
      removeAt: (i) => this.setState({ box: this.state.box.filter((_, j) => j !== i) })
    };
  }
}
</script>
</body>
</html>
