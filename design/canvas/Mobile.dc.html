<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone · Minimal list</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./wp.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1e1e1e}a:hover{color:#000}
</style>
</helmet>
<div class="sf" style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; position: relative; overflow: hidden">
<div style="padding: 28px 20px 180px; display: flex; flex-direction: column; gap: 20px; height: 100%; overflow-y: auto; box-sizing: border-box">
<div style="display: flex; flex-direction: column; gap: 6px"><h2 style="font-size: 26px; font-weight: 600; line-height: 1.15">Build your holiday treat box</h2><p style="color: #5c5c5c; font-size: 15px">Pick 4 or more. The more you add, the more you save.</p></div>
<div style="display: flex; gap: 8px; overflow-x: auto"><button type="button" class="sf-chip sel">All</button><button type="button" class="sf-chip">Accessories</button><button type="button" class="sf-chip">T-shirts</button></div>
<ul style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{products}}" as="p" hint-placeholder-count="5">
<li style="display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid #ececec">
<img src="{{p.img}}" alt="{{p.name}}" style="width: 64px; height: 64px; border-radius: 10px; object-fit: cover">
<div style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 500">{{p.name}}</span><span class="sf-price" style="color: #3c3c3c; font-size: 14px">{{p.priceS}}</span></div>
<sc-if value="{{p.empty}}" hint-placeholder-val="{{true}}"><button type="button" class="sf-add" style="width: 44px; padding: 0" onClick="{{p.add}}" aria-label="Add {{p.name}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></sc-if>
<sc-if value="{{p.qty}}" hint-placeholder-val="{{false}}"><div class="sf-qty" style="background: {{accent}}"><button type="button" onClick="{{p.rem}}" aria-label="Remove one {{p.name}}">−</button><span>{{p.qty}}</span><button type="button" onClick="{{p.add}}" aria-label="Add one more {{p.name}}">+</button></div></sc-if>
</li>
</sc-for>
</ul>
</div>
<sc-if value="{{open}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{toggle}}" aria-label="Close box" style="position: absolute; inset: 0; border: 0; background: rgba(0,0,0,.35); cursor: pointer"></button></sc-if>
<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 18px 18px 0 0; box-shadow: 0 -6px 24px rgba(0,0,0,.1); padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 14px">
<button type="button" onClick="{{toggle}}" aria-expanded="{{open}}" style="border: 0; background: transparent; padding: 0; font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 10px; color: #1e1e1e">
<span style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #d6d6d6"></span>
<span style="display: flex; justify-content: space-between; width: 100%; font-size: 14px" aria-live="polite"><span>{{msgLead}} <b>{{msgDeal}}</b></span><span style="color: #5c5c5c">{{count}}/12</span></span>
<span class="sf-prog" style="display: block; width: 100%; color: {{accent}}"><i style="width: {{pct}}%; background: {{accent}}"></i><sc-for list="{{ticks}}" as="k" hint-placeholder-count="3"><span class="sf-tick {{k.cls}}" style="left: {{k.left}}%"></span></sc-for></span>
</button>
<sc-if value="{{open}}" hint-placeholder-val="{{false}}">
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="3"><li style="display: flex; align-items: center; gap: 12px; font-size: 14px"><img src="{{l.img}}" alt="" style="width: 40px; height: 40px; border-radius: 8px; object-fit: cover"><span style="flex: 1">{{l.qty}} × {{l.name}}</span><span class="sf-price">{{l.lineS}}</span></li></sc-for>
</ul>
<label style="display: flex; gap: 10px; align-items: center; font-size: 14px"><input type="checkbox" style="width: 18px; height: 18px; margin: 0">Gift wrap and a note (+10.00৳)</label>
</sc-if>
<div style="display: flex; align-items: center; gap: 14px">
<div style="flex: 1"><span style="display: block; font-size: 12px; color: #5c5c5c">You save {{discS}}</span><b class="sf-price" style="font-size: 20px">{{totalS}}</b></div>
<div style="width: 190px">
<sc-if value="{{ready}}" hint-placeholder-val="{{true}}"><button type="button" class="sf-cta" style="background: {{accent}}; color: #fff">Add to cart</button></sc-if>
<sc-if value="{{notReady}}" hint-placeholder-val="{{false}}"><button type="button" class="sf-cta off" disabled>{{ctaWait}}</button></sc-if>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1e1e1e","options":["#1e1e1e","#3858e9","#1f6f4a","#b5532a"]},"$preview":{"width":390,"height":844}}'>
const PB_P = [
  { id: 'beanie', name: 'Beanie', price: 18, img: '/_blob/a21d75322d1f2c79c0b493d770e100ba' },
  { id: 'belt', name: 'Belt', price: 55, img: '/_blob/dbf6bf4993577849550a7cf059cabaac' },
  { id: 'cap', name: 'Cap', price: 16, img: '/_blob/7bb413bb81c62e7140669f3f245799f6' },
  { id: 'sunglasses', name: 'Sunglasses', price: 90, img: '/_blob/3b8ae96639edc920d9a59a6c11f5a7d8' },
  { id: 'tshirt', name: 'T-shirt', price: 18, img: '/_blob/e08619cc92331767f559db4a150cf594' }
];
const PB_T = [{ q: 4, d: 10 }, { q: 6, d: 15 }, { q: 12, d: 25 }];
const PB_CAP = 12, PB_MIN = 4, PB_PER = 3;
function pbMoney(n) { return n.toFixed(2) + '৳'; }
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { box: { beanie: 2, cap: 1, tshirt: 2 }, open: false }; }
  renderVals() {
    const accent = this.props.accent ?? '#1e1e1e';
    const box = this.state.box;
    const count = Object.values(box).reduce((a, b) => a + b, 0);
    const sub = PB_P.reduce((s, p) => s + (box[p.id] || 0) * p.price, 0);
    let tier = null; PB_T.forEach((t) => { if (count >= t.q) tier = t; });
    const next = PB_T.find((t) => t.q > count);
    const disc = tier ? Math.round(sub * tier.d) / 100 : 0;
    const set = (b) => this.setState({ box: b });
    return {
      accent, count, open: this.state.open,
      toggle: () => this.setState({ open: !this.state.open }),
      msgLead: next ? 'Add ' + (next.q - count) + ' more to get' : 'Best deal unlocked:',
      msgDeal: next ? next.d + '% off' : PB_T[PB_T.length - 1].d + '% off',
      pct: Math.min(100, (count / PB_CAP) * 100),
      ticks: PB_T.map((t) => ({ left: (t.q / PB_CAP) * 100, cls: count >= t.q ? 'on' : '' })),
      products: PB_P.map((p) => { const qty = box[p.id] || 0; return { ...p, qty, empty: qty === 0, priceS: pbMoney(p.price),
        add: () => { if (count >= PB_CAP || qty >= PB_PER) return; set({ ...box, [p.id]: qty + 1 }); },
        rem: () => { const b = { ...box }; if (qty <= 1) delete b[p.id]; else b[p.id] = qty - 1; set(b); } }; }),
      lines: PB_P.filter((p) => box[p.id]).map((p) => ({ ...p, qty: box[p.id], lineS: pbMoney(box[p.id] * p.price) })),
      discS: pbMoney(disc), totalS: pbMoney(sub - disc),
      ready: count >= PB_MIN, notReady: count < PB_MIN,
      ctaWait: 'Add ' + (PB_MIN - count) + ' more'
    };
  }
}
</script>
</body>
</html>
