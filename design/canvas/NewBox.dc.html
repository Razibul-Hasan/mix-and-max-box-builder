<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ProductBoxes · Create a box</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./wp.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#3858e9}a:hover{color:#2145e6}
</style>
</helmet>
<div class="wp" style="position: relative; min-height: 900px">
<dc-import name="Boxes" hint-size="100%,900px"></dc-import>
<div class="scrim">
<div class="modal" role="dialog" aria-modal="true" aria-labelledby="nb-h">
<div class="modal-h"><h2 id="nb-h">Create a box</h2><a class="btn btn-ghost btn-icon" href="Boxes.dc.html" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a></div>
<div class="modal-b">
<div><label class="lbl" for="nb-name">Box name</label><input class="input" id="nb-name" type="text" value="Holiday treat box"><p class="help">Only you see this. You can write the shopper headline later.</p></div>
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend class="lbl">How does the discount work?</legend>
<sc-for list="{{types}}" as="t" hint-placeholder-count="3">
<button type="button" class="choice {{t.cls}}" onClick="{{t.pick}}" style="text-align: left; font: inherit; width: 100%">
<span class="radio {{t.radio}}" aria-hidden="true" style="margin-top: 2px"></span>
<span style="flex: 1"><b>{{t.title}}</b><span class="muted">{{t.desc}}</span></span>
<span class="badge" style="background: #f0f0f0">{{t.eg}}</span>
</button>
</sc-for>
</fieldset>
<div class="notice"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3858e9" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></svg><p>Next you pick products, set the discount and choose a look. Nothing goes live until you publish.</p></div>
</div>
<div class="modal-f"><a class="btn btn-tertiary" href="Boxes.dc.html">Cancel</a><a class="btn btn-primary" href="EditorProducts.dc.html">Create and pick products</a></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { type: 'tiered' }; }
  renderVals() {
    const list = [
      { id: 'tiered', title: 'Bigger box, bigger discount', desc: 'Shoppers add up to a limit. More items unlock more off.', eg: '4 = 10%, 6 = 15%' },
      { id: 'fixed', title: 'Pick a box size', desc: 'Shoppers choose a size, then fill every slot.', eg: '6-pack' },
      { id: 'bundle', title: 'Set price bundle', desc: 'A fixed number of items for one price.', eg: '3 for 45.00৳' }
    ];
    return {
      types: list.map((t) => ({ ...t, cls: this.state.type === t.id ? 'sel' : '', radio: this.state.type === t.id ? 'on' : '', pick: () => this.setState({ type: t.id }) }))
    };
  }
}
</script>
</body>
</html>
