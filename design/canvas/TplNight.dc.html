<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Template 08 · Night</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./wp.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&display=swap">
<style>
body{margin:0}
.t8{font-family:"Space Grotesk",system-ui,sans-serif;color:#f4f4f5}
.t8 *{box-sizing:border-box}
.t8 h2,.t8 h3,.t8 p{margin:0}
.t8 .card{background:#16161c;border:1px solid #24242c;border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:12px}
.t8 .card .pic{background:#e9ecef;border-radius:16px;overflow:hidden}
.t8 .card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;mix-blend-mode:multiply}
.t8 .add{height:46px;border-radius:14px;border:1px solid #33333d;background:transparent;color:#f4f4f5;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.t8 .qty{height:46px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;color:#0c0c10}
.t8 .qty button{width:46px;height:46px;border:0;background:transparent;color:#0c0c10;font-size:20px;cursor:pointer;font-family:inherit}
</style>
</helmet>
<div class="t8" style="width: 1280px; min-height: 1200px; box-sizing: border-box; background: #0c0c10; padding: 56px 64px; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 40px">
<div style="display: flex; flex-direction: column; gap: 18px">
<span style="align-self: flex-start; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: {{accent}}">● Live deal · 10 / 15 / 25% off</span>
<h2 style="font-size: 80px; font-weight: 700; line-height: 0.92; letter-spacing: -0.045em">Build the box.<br><span style="color: #6b6b78">Drop the price.</span></h2>
</div>
<div style="position: relative; width: 210px; height: 210px; flex: 0 0 210px" aria-live="polite">
<svg width="210" height="210" viewBox="0 0 210 210" aria-hidden="true"><circle cx="105" cy="105" r="92" fill="none" stroke="#1f1f27" stroke-width="14"/><circle cx="105" cy="105" r="92" fill="none" stroke="{{accent}}" stroke-width="14" stroke-linecap="round" stroke-dasharray="{{dash}} 600" transform="rotate(-90 105 105)"/></svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center"><b style="font-size: 52px; line-height: 1; letter-spacing: -0.04em">{{count}}<span style="font-size: 22px; color: #6b6b78">/12</span></b><span style="font-size: 15px; font-weight: 600; color: {{accent}}; margin-top: 6px">{{nowDeal}}</span></div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{products}}" as="p" hint-placeholder-count="5">
<article class="card">
<div class="pic"><img src="{{p.img}}" alt="{{p.name}}"></div>
<div style="display: flex; justify-content: space-between; padding: 0 4px"><b style="font-size: 17px; font-weight: 600">{{p.name}}</b><span style="color: #a1a1aa">{{p.priceS}}</span></div>
<sc-if value="{{p.empty}}" hint-placeholder-val="{{true}}"><button type="button" class="add" onClick="{{p.add}}">+ Add</button></sc-if>
<sc-if value="{{p.has}}" hint-placeholder-val="{{false}}"><div class="qty" style="background: {{accent}}"><button type="button" onClick="{{p.rem}}" aria-label="Remove one {{p.name}}">−</button><b>{{p.qty}}</b><button type="button" onClick="{{p.add}}" aria-label="Add one more {{p.name}}">+</button></div></sc-if>
</article>
</sc-for>
</div>
<section style="background: #16161c; border: 1px solid #24242c; border-radius: 26px; padding: 26px 28px; display: flex; align-items: center; gap: 32px" aria-label="Your box">
<div style="flex: 1; display: flex; flex-direction: column; gap: 14px">
<p style="font-size: 18px">{{msgLead}} <b style="color: {{accent}}">{{msgDeal}}</b></p>
<div style="position: relative; height: 10px; border-radius: 5px; background: #24242c"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{pct}}%; border-radius: 5px; background: {{accent}}; box-shadow: 0 0 18px {{accent}}"></div></div>
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #8b8b96"><span>0</span><span>4 · 10%</span><span>6 · 15%</span><span>12 · 25%</span></div>
</div>
<div style="text-align: right"><span style="display: block; font-size: 14px; color: #8b8b96">You save {{discS}}</span><b style="font-size: 36px; letter-spacing: -0.03em">{{totalS}}</b></div>
<sc-if value="{{ready}}" hint-placeholder-val="{{true}}"><button type="button" style="height: 60px; padding: 0 30px; border: 0; border-radius: 18px; background: {{accent}}; color: #0c0c10; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Add box to cart</button></sc-if>
<sc-if value="{{notReady}}" hint-placeholder-val="{{false}}"><button type="button" disabled style="height: 60px; padding: 0 30px; border: 0; border-radius: 18px; background: #24242c; color: #8b8b96; font: inherit; font-size: 16px; font-weight: 600">{{ctaWait}}</button></sc-if>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c8ff2e","options":["#c8ff2e","#ff4f8b","#5cc8ff","#ffb02e"]},"$preview":{"width":1280,"height":1200}}'>
const PB_P = [
  { id: 'beanie', name: 'Beanie', price: 18, img: '/_blob/a21d75322d1f2c79c0b493d770e100ba' },
  { id: 'belt', name: 'Belt', price: 55, img: '/_blob/dbf6bf4993577849550a7cf059cabaac' },
  { id: 'cap', name: 'Cap', price: 16, img: '/_blob/7bb413bb81c62e7140669f3f245799f6' },
  { id: 'sunglasses', name: 'Sunglasses', price: 90, img: '/_blob/3b8ae96639edc920d9a59a6c11f5a7d8' },
  { id: 'tshirt', name: 'T-shirt', price: 18, img: '/_blob/e08619cc92331767f559db4a150cf594' }
];
const PB_T = [{ q: 4, d: 10 }, { q: 6, d: 15 }, { q: 12, d: 25 }];
const PB_CAP = 12, PB_MIN = 4, PB_PER = 3;
function pbMoney(n) { return n.toFixed(2) + '৳'; }
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { box: { beanie: 2, cap: 1, tshirt: 2 } }; }
  renderVals() {
    const accent = this.props.accent ?? '#c8ff2e';
    const box = this.state.box;
    const count = Object.values(box).reduce((a, b) => a + b, 0);
    const sub = PB_P.reduce((s, p) => s + (box[p.id] || 0) * p.price, 0);
    let tier = null; PB_T.forEach((t) => { if (count >= t.q) tier = t; });
    const next = PB_T.find((t) => t.q > count);
    const disc = tier ? Math.round(sub * tier.d) / 100 : 0;
    const set = (b) => this.setState({ box: b });
    return {
      accent, count,
      dash: Math.round((count / PB_CAP) * 578),
      nowDeal: tier ? tier.d + '% off now' : 'No discount yet',
      products: PB_P.map((p) => { const qty = box[p.id] || 0; return { ...p, qty, has: qty > 0, empty: qty === 0, priceS: pbMoney(p.price),
        add: () => { if (count >= PB_CAP || qty >= PB_PER) return; set({ ...box, [p.id]: qty + 1 }); },
        rem: () => { const b = { ...box }; if (qty <= 1) delete b[p.id]; else b[p.id] = qty - 1; set(b); } }; }),
      msgLead: next ? 'Add ' + (next.q - count) + ' more to unlock' : 'Max unlocked:',
      msgDeal: next ? next.d + '% off' : '25% off',
      pct: Math.min(100, (count / PB_CAP) * 100),
      discS: pbMoney(disc), totalS: pbMoney(sub - disc),
      ready: count >= PB_MIN, notReady: count < PB_MIN,
      ctaWait: 'Add ' + (PB_MIN - count) + ' more'
    };
  }
}
</script>
</body>
</html>
