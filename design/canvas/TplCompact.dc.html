<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Template 10 · Compact card</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./wp.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400..700&display=swap">
<style>
body{margin:0}
.t10{font-family:Inter,system-ui,sans-serif;color:#111}
.t10 *{box-sizing:border-box}
.t10 h2,.t10 p{margin:0}
.t10 .disp{font-family:"Bricolage Grotesque",system-ui,sans-serif}
.t10 .pic{border-radius:16px;background:#f3f4f6;overflow:hidden;position:relative}
.t10 .pic img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;mix-blend-mode:multiply}
.t10 .plus{position:absolute;right:8px;bottom:8px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#111}
.t10 .pill{position:absolute;right:8px;bottom:8px;height:40px;border-radius:20px;display:flex;align-items:center;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.t10 .pill button{width:36px;height:40px;border:0;background:transparent;color:#fff;font-size:18px;cursor:pointer;font-family:inherit}
</style>
</helmet>
<div class="t10" style="width: 640px; min-height: 1200px; box-sizing: border-box; background: #f4f4f2; padding: 40px">
<div style="background: #ffffff; border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 22px; box-shadow: 0 20px 50px -24px rgba(0,0,0,.25)">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px"><h2 class="disp" style="font-size: 34px; font-weight: 800; line-height: 1; letter-spacing: -0.03em">Build a box</h2><p style="color: #5b6069; font-size: 15px">Mix any 4+ and save up to 25%.</p></div>
<span class="disp" style="flex: 0 0 auto; width: 76px; height: 76px; border-radius: 50%; background: {{accent}}; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-8deg); line-height: 1"><b style="font-size: 24px">{{nowNum}}</b><span style="font-size: 11px; font-weight: 600">{{nowLbl}}</span></span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: #f3f4f6; border-radius: 16px; padding: 6px">
<sc-for list="{{tiers}}" as="t" hint-placeholder-count="3"><div style="padding: 10px; text-align: center; border-radius: 12px; background: {{t.bg}}; color: {{t.fg}}"><b style="display: block; font-size: 17px">{{t.d}}% off</b><span style="font-size: 12px">{{t.q}}+ items</span></div></sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{products}}" as="p" hint-placeholder-count="5">
<article style="display: flex; flex-direction: column; gap: 8px">
<div class="pic"><img src="{{p.img}}" alt="{{p.name}}">
<sc-if value="{{p.empty}}" hint-placeholder-val="{{true}}"><button type="button" class="plus" onClick="{{p.add}}" aria-label="Add {{p.name}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></sc-if>
<sc-if value="{{p.has}}" hint-placeholder-val="{{false}}"><div class="pill" style="background: {{accent}}"><button type="button" onClick="{{p.rem}}" aria-label="Remove one {{p.name}}">−</button><b style="min-width: 12px; text-align: center; font-size: 14px">{{p.qty}}</b><button type="button" onClick="{{p.add}}" aria-label="Add one more {{p.name}}">+</button></div></sc-if>
</div>
<div style="display: flex; justify-content: space-between; font-size: 14px"><b style="font-weight: 600">{{p.name}}</b><span>{{p.priceS}}</span></div>
</article>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 18px; background: #f7f7f8; border-radius: 20px">
<div style="display: flex; justify-content: space-between; font-size: 14px" aria-live="polite"><span>{{msgLead}} <b style="color: {{accent}}">{{msgDeal}}</b></span><span style="color: #5b6069">{{count}}/12</span></div>
<div style="height: 8px; border-radius: 4px; background: #e6e7ea; overflow: hidden"><div style="height: 100%; width: {{pct}}%; background: {{accent}}; border-radius: 4px"></div></div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-top: 4px">
<div><span style="display: block; font-size: 12px; color: #5b6069">You save {{discS}}</span><b class="disp" style="font-size: 26px; letter-spacing: -0.02em">{{totalS}}</b></div>
<sc-if value="{{ready}}" hint-placeholder-val="{{true}}"><button type="button" style="height: 52px; padding: 0 24px; border: 0; border-radius: 26px; background: #111; color: #fff; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Add to cart</button></sc-if>
<sc-if value="{{notReady}}" hint-placeholder-val="{{false}}"><button type="button" disabled style="height: 52px; padding: 0 24px; border: 0; border-radius: 26px; background: #e6e7ea; color: #5b6069; font: inherit; font-size: 15px; font-weight: 600">{{ctaWait}}</button></sc-if>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#e11d74","options":["#e11d74","#111111","#2b4bff","#0a7a3b"]},"$preview":{"width":640,"height":1200}}'>
const PB_P = [
  { id: 'beanie', name: 'Beanie', price: 18, img: '/_blob/a21d75322d1f2c79c0b493d770e100ba' },
  { id: 'belt', name: 'Belt', price: 55, img: '/_blob/dbf6bf4993577849550a7cf059cabaac' },
  { id: 'cap', name: 'Cap', price: 16, img: '/_blob/7bb413bb81c62e7140669f3f245799f6' },
  { id: 'sunglasses', name: 'Sunglasses', price: 90, img: '/_blob/3b8ae96639edc920d9a59a6c11f5a7d8' },
  { id: 'tshirt', name: 'T-shirt', price: 18, img: '/_blob/e08619cc92331767f559db4a150cf594' }
];
const PB_T = [{ q: 4, d: 10 }, { q: 6, d: 15 }, { q: 12, d: 25 }];
const PB_CAP = 12, PB_MIN = 4, PB_PER = 3;
function pbMoney(n) { return n.toFixed(2) + '৳'; }
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { box: { beanie: 2, cap: 1, tshirt: 2 } }; }
  renderVals() {
    const accent = this.props.accent ?? '#e11d74';
    const box = this.state.box;
    const count = Object.values(box).reduce((a, b) => a + b, 0);
    const sub = PB_P.reduce((s, p) => s + (box[p.id] || 0) * p.price, 0);
    let tier = null; PB_T.forEach((t) => { if (count >= t.q) tier = t; });
    const next = PB_T.find((t) => t.q > count);
    const disc = tier ? Math.round(sub * tier.d) / 100 : 0;
    const set = (b) => this.setState({ box: b });
    return {
      accent, count,
      nowNum: tier ? tier.d + '%' : '25%', nowLbl: tier ? 'off now' : 'max off',
      tiers: PB_T.map((t) => { const on = !!tier && tier.q === t.q; return { ...t, bg: on ? '#fff' : 'transparent', fg: on ? accent : '#5b6069' }; }),
      products: PB_P.map((p) => { const qty = box[p.id] || 0; return { ...p, qty, has: qty > 0, empty: qty === 0, priceS: pbMoney(p.price),
        add: () => { if (count >= PB_CAP || qty >= PB_PER) return; set({ ...box, [p.id]: qty + 1 }); },
        rem: () => { const b = { ...box }; if (qty <= 1) delete b[p.id]; else b[p.id] = qty - 1; set(b); } }; }),
      msgLead: next ? 'Add ' + (next.q - count) + ' more for' : 'Best deal:',
      msgDeal: next ? next.d + '% off' : '25% off',
      pct: Math.min(100, (count / PB_CAP) * 100),
      discS: pbMoney(disc), totalS: pbMoney(sub - disc),
      ready: count >= PB_MIN, notReady: count < PB_MIN,
      ctaWait: (PB_MIN - count) + ' more to go'
    };
  }
}
</script>
</body>
</html>
