<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Box editor · Products</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./lib/wpc.css">
<link rel="stylesheet" href="./wp.css">
<script src="./lib/wpc.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#3858e9}a:hover{color:#2145e6}
.pb-steps{display:flex;align-items:center;gap:4px;margin:0 auto}
.prow{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid #f0f0f0}
.prow .components-base-control,.prow .components-checkbox-control{margin:0}
</style>
</helmet>
<div class="wp" style="min-height: 960px; background: #f0f0f1; display: flex; flex-direction: column">
<header class="ed-top2" style="gap: 8px">
<a href="Boxes.dc.html" aria-label="Back to boxes" style="width: 64px; height: 64px; margin-left: -16px; background: #1e1e1e; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 7.5 12 3l9 4.5-9 4.5-9-4.5Z"/><path d="M3 7.5v9L12 21l9-4.5v-9M12 12v9"/></svg></a>
<x-import component-from-global-scope="WPC.IconButton" name="undo" label="Undo"></x-import>
<x-import component-from-global-scope="WPC.IconButton" name="redo" label="Redo"></x-import>
<nav class="pb-steps" aria-label="Steps">
<x-import component-from-global-scope="WPC.Button" variant="secondary" href="EditorProducts.dc.html" aria-current="step">1 · Products</x-import>
<x-import component-from-global-scope="WPC.Button" variant="tertiary" href="EditorDiscounts.dc.html">2 · Discounts</x-import>
<x-import component-from-global-scope="WPC.Button" variant="tertiary" href="EditorDesign.dc.html">3 · Design</x-import>
</nav>
<div style="width: 220px">
<x-import component-from-global-scope="WPC.ToggleGroupControl" label="Preview size" hide-label-from-vision="{{yes}}" is-block="{{yes}}" value="{{device}}" on-change="{{setDevice}}">
<x-import component-from-global-scope="WPC.ToggleGroupControlOption" value="desktop" label="Desktop"></x-import>
<x-import component-from-global-scope="WPC.ToggleGroupControlOption" value="mobile" label="Phone"></x-import>
</x-import>
</div>
<x-import component-from-global-scope="WPC.Button" variant="tertiary">Save draft</x-import>
<x-import component-from-global-scope="WPC.Button" variant="primary" href="Publish.dc.html">Publish</x-import>
</header>
<div style="display: flex; flex-wrap: wrap; flex: 1">
<section class="ed-stage" aria-label="Shopper preview" style="padding-bottom: 28px">
<sc-if value="{{desk}}" hint-placeholder-val="{{true}}">
<div class="browser">
<div class="browser-bar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="url"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>plugin-dev.local/holiday-treat-box/</span><span class="live-tag">Preview</span></div>
<div class="iframe-body" style="height: 790px"><div style="width: 1280px; zoom: 0.81"><dc-import name="TplClassic" hint-size="1280px,1200px"></dc-import></div></div>
</div>
</sc-if>
<sc-if value="{{phone}}" hint-placeholder-val="{{false}}"><div class="phone"><dc-import name="Mobile" hint-size="390px,844px"></dc-import></div></sc-if>
</section>
<aside style="width: 360px; flex: 0 0 360px; background: #fff; border-left: 1px solid #e0e0e0; display: flex; flex-direction: column; height: 896px" aria-label="Products">
<div style="padding: 16px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #e0e0e0">
<div><h1 style="font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em">What goes in the box</h1><p class="muted" style="margin-top: 4px">{{count}} products picked. Shoppers see them in this order.</p></div>
<x-import component-from-global-scope="WPC.ToggleGroupControl" label="Choose products by" is-block="{{yes}}" value="{{source}}" on-change="{{setSource}}">
<x-import component-from-global-scope="WPC.ToggleGroupControlOption" value="pick" label="Pick"></x-import>
<x-import component-from-global-scope="WPC.ToggleGroupControlOption" value="category" label="Category"></x-import>
<x-import component-from-global-scope="WPC.ToggleGroupControlOption" value="tag" label="Tag"></x-import>
</x-import>
<x-import component-from-global-scope="WPC.SearchControl" label="Search products" placeholder="Search by name or SKU" value="{{q}}" on-change="{{setQ}}"></x-import>
<x-import component-from-global-scope="WPC.SelectControl" label="Category" hide-label-from-vision="{{yes}}" value="{{cat}}" options="{{catOpts}}" on-change="{{setCat}}"></x-import>
</div>
<div style="flex: 1; overflow-y: auto">
<sc-for list="{{products}}" as="p" hint-placeholder-count="8">
<div class="prow" style="background: {{p.bg}}">
<x-import component-from-global-scope="WPC.CheckboxControl" label="{{p.name}}" hide-label-from-vision="{{yes}}" checked="{{p.on}}" on-change="{{p.toggle}}"></x-import>
<sc-if value="{{p.img}}" hint-placeholder-val="{{true}}"><img class="thumb" src="{{p.img}}" alt="" style="border-radius: 4px"></sc-if>
<sc-if value="{{p.noImg}}" hint-placeholder-val="{{false}}"><span class="thumb" style="display: flex; align-items: center; justify-content: center; color: #757575; border-radius: 4px">{{p.initial}}</span></sc-if>
<span style="flex: 1"><b style="font-weight: 500; display: block">{{p.name}}</b><span style="font-size: 12px; color: {{p.stockColor}}">{{p.stock}}</span></span>
<span style="font-variant-numeric: tabular-nums">{{p.price}}</span>
</div>
</sc-for>
</div>
<div style="padding: 12px 16px; border-top: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; gap: 8px">
<x-import component-from-global-scope="WPC.Button" variant="tertiary" on-click="{{clear}}">Clear all</x-import>
<x-import component-from-global-scope="WPC.Button" variant="primary" href="EditorDiscounts.dc.html">Continue to discounts</x-import>
</div>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
const P = [
  { id: 'beanie', name: 'Beanie', price: '18.00৳', stock: 'In stock', cat: 'acc', img: '/_blob/a21d75322d1f2c79c0b493d770e100ba' },
  { id: 'belt', name: 'Belt', price: '55.00৳', stock: 'In stock', cat: 'acc', img: '/_blob/dbf6bf4993577849550a7cf059cabaac' },
  { id: 'cap', name: 'Cap', price: '16.00৳', stock: 'Only 3 left', cat: 'acc', img: '/_blob/7bb413bb81c62e7140669f3f245799f6' },
  { id: 'sunglasses', name: 'Sunglasses', price: '90.00৳', stock: 'In stock', cat: 'acc', img: '/_blob/3b8ae96639edc920d9a59a6c11f5a7d8' },
  { id: 'tshirt', name: 'T-shirt', price: '18.00৳', stock: 'In stock', cat: 'tee', img: '/_blob/e08619cc92331767f559db4a150cf594' },
  { id: 'polo', name: 'Polo', price: '20.00৳', stock: 'In stock', cat: 'tee', img: '' },
  { id: 'hoodie', name: 'Hoodie', price: '42.00৳', stock: 'In stock', cat: 'hood', img: '' },
  { id: 'longsleeve', name: 'Long sleeve tee', price: '25.00৳', stock: 'Out of stock', cat: 'tee', img: '' }
];
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { picked: { beanie: 1, belt: 1, cap: 1, sunglasses: 1, tshirt: 1 }, device: 'desktop', source: 'pick', q: '', cat: 'all' }; }
  renderVals() {
    const s = this.state, picked = s.picked;
    const q = (s.q || '').toLowerCase();
    const desk = s.device !== 'mobile';
    return {
      yes: true, count: Object.keys(picked).length,
      device: s.device, setDevice: (v) => this.setState({ device: v || 'desktop' }), desk, phone: !desk,
      source: s.source, setSource: (v) => this.setState({ source: v || 'pick' }),
      q: s.q, setQ: (v) => this.setState({ q: v }),
      cat: s.cat, setCat: (v) => this.setState({ cat: v }),
      catOpts: [{ label: 'All categories', value: 'all' }, { label: 'Accessories', value: 'acc' }, { label: 'T-shirts', value: 'tee' }, { label: 'Hoodies', value: 'hood' }],
      clear: () => this.setState({ picked: {} }),
      products: P.filter((p) => (s.cat === 'all' || p.cat === s.cat) && (!q || p.name.toLowerCase().includes(q))).map((p) => ({
        ...p, noImg: !p.img, initial: p.name.charAt(0), on: !!picked[p.id], bg: picked[p.id] ? '#f6f8ff' : '#fff',
        stockColor: p.stock === 'In stock' ? '#757575' : (p.stock === 'Out of stock' ? '#b32d2e' : '#8a4d00'),
        toggle: () => { const n = { ...picked }; if (n[p.id]) { delete n[p.id]; } else { n[p.id] = 1; } this.setState({ picked: n }); }
      }))
    };
  }
}
</script>
</body>
</html>
